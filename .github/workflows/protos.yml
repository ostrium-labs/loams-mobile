name: protos

on:
  pull_request:
    paths:
      - proto/**
      - buf.yaml
      - buf.gen.*.yaml
      - conformance/proto-ref.lock
      - scripts/*.sh
      - android/proto/src/generated/**
      - ios/Packages/LoamsProto/Sources/LoamsProto/Generated/**
      - mock/gen/**
      - .github/workflows/protos.yml
  push:
    branches: [main, dev]
    paths:
      - proto/**
      - buf.yaml
      - buf.gen.*.yaml
      - conformance/proto-ref.lock
      - scripts/*.sh
      - android/proto/src/generated/**
      - ios/Packages/LoamsProto/Sources/LoamsProto/Generated/**
      - mock/gen/**
      - .github/workflows/protos.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  drift:
    name: lint, lock and generated-code drift
    runs-on: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && (vars.RUNNER_MAIN || 'blacksmith-4vcpu-ubuntu-2404') || (vars.RUNNER_LIGHT || 'ubuntu-latest') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      # Remote plugins run on buf.build without a token. That is rate-limited;
      # generate.sh retries with back-off. No secret is used (an optional
      # BUF_TOKEN would lift the limit).
      - run: scripts/check-drift.sh
